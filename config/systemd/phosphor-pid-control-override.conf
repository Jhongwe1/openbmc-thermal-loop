# systemd drop-in：讓 swampd 改吃本專案的設定檔，並輸出 PID 內部計算。
#
# 部署位置（BMC 上）：
#   /etc/systemd/system/phosphor-pid-control.service.d/override.conf
#
# 為什麼是 drop-in 而不是直接改 /usr/share/swampd/config.json：
#   OpenBMC 的 / 是唯讀 squashfs，/usr/share 改不動（會回 Read-only file system）。
#   /etc 與 /var 才可寫。drop-in 是 systemd 官方的覆寫機制，不需要動唯讀區。
#
# 為什麼 ExecStart 要先空一行再重設：
#   systemd 對 ExecStart 這類「可重複」的指令，drop-in 預設是「再加一個」而不是
#   「取代」。先寫一個空的 ExecStart= 把清單清空，後面那行才是真正的取代。

[Service]
# ★ 這三行不是可有可無的。
#   --log 指向的目錄、以及 fan 的假 sysfs 檔，都在 /tmp（tmpfs），重開機就消失；
#   但這個 drop-in 在 /etc，是持久的。兩者壽命不一致的結果是
#   「重開機後 swampd 永遠起不來」——  而且錯誤訊息（Directory does not exist）
#   出現在 journal 裡，跟「我改了設定」這件事看起來毫無關聯。
#   執行前提必須跟著 unit 一起走，不能靠人手動 mkdir。
ExecStartPre=/bin/mkdir -p /tmp/pidlog /tmp/sys
ExecStartPre=/bin/sh -c 'test -s /tmp/sys/fan0_input || echo 3000 > /tmp/sys/fan0_input'
ExecStartPre=/bin/sh -c 'test -f /tmp/sys/pwm0 || echo 0 > /tmp/sys/pwm0'

ExecStart=
ExecStart=/usr/bin/swampd --conf /etc/thermal-loop/config.json -l /tmp/pidlog -g
#                                                              │            └─ --corelogging：
#                                                              │               輸出 pidcore.* / pidcoeffs.*
#                                                              │               ← Fig 3 第三面板（積分項軌跡）的資料來源
#                                                              └─ --log：輸出 zone_N.log（CSV）

[Unit]
# 上游是 Restart=always + StartLimitInterval=0，也就是「無限次重啟，永不放棄」。
# 在真實硬體上那是對的：風扇控制停掉會燒機器，寧可一直重試。
# 但在這個測試床上，一個起不來的 swampd 會每 5 秒重啟一次，把 QEMU 的 CPU 吃光，
# 連 SSH 都連不進去（實測：load average 7.58，最後整台機器重開）。
#
# 這裡刻意改成「60 秒內失敗 3 次就停」——  讓失敗是安靜而明確的，而不是把整台
# 機器拖垮。這是「同一個設定在不同環境下的正確答案不一樣」的具體例子。
StartLimitIntervalSec=60
StartLimitBurst=3
