# bench/ 的 Python 這一側：相依套件宣告 + 工具設定。
#
# C++ 那一側由 meson 管（見 meson.build）。兩套建置系統不是懶惰，是分工：
# plant 與模擬要編成執行檔，實驗編排與畫圖不用。
#
# 安裝：
#   source ~/.venvs/thermal/bin/activate
#   pip install -e ".[dev]"
#
# 這個套件本身沒有任何 Python 模組（py-modules = []），
# `pip install -e .` 的唯一作用是把下面的相依裝起來，
# 並讓 ruff / pytest 找得到設定。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbmc-thermal-loop-bench"
version = "0.1.0"
description = "Experiment orchestration and plotting for the thermal control loop"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "dbus-next", "robotframework", "robotframework-requests"]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes（基本錯誤）
# I   = import 排序        UP = 用新版 Python 語法
# B   = flake8-bugbear，抓「語法對但幾乎一定是 bug」的寫法
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# bench/ 與 tools/ 刻意不是 package（沒有 __init__.py，見 py-modules = []），
# 所以 ruff 預設會把 `import metrics` 當成第三方套件，排序規則就跟著錯。
# 這些**就是**這個 repo 自己的模組，直接講清楚，不要靠改 import 順序去迎合它。
known-first-party = ["metrics", "parse_l2", "plot", "provenance",
                     "set_die_temp", "tune", "exp06_cascade"]

[tool.pytest.ini_options]
# 只有 test/python/ 底下是 Python 測試。不寫的話 pytest 會從當前目錄往下掃，
# 在 repo 根目錄執行時會去翻 subprojects/（上游原始碼）與 build/。
testpaths = ["test/python"]
